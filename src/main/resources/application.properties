spring.application.name=agrolink-backend

spring.datasource.url=jdbc:mysql://localhost:3306/agrolink_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

app.security.require-auth=${APP_SECURITY_REQUIRE_AUTH:false}
app.admin.token-secret=${APP_ADMIN_TOKEN_SECRET:replace-with-a-long-random-secret}
app.admin.token-expiry-hours=${APP_ADMIN_TOKEN_EXPIRY_HOURS:12}

