spring.application.name=agrolink-backend
server.address=0.0.0.0
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/agrolink_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

app.security.require-auth=${APP_SECURITY_REQUIRE_AUTH:false}
app.admin.token-secret=${APP_ADMIN_TOKEN_SECRET:replace-with-a-long-random-secret}
app.admin.token-expiry-hours=${APP_ADMIN_TOKEN_EXPIRY_HOURS:12}

payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.merchant-id=${PAYHERE_MERCHANT_ID:1222402}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:3000/payment/success}
payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:3000/payment/cancel}
payhere.notify-url=${PAYHERE_NOTIFY_URL:http://localhost:8080/api/payments/payhere/notify}